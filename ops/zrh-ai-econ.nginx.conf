server {
    listen 80;
    server_name www.zrh-ai-econ.com;
    return 301 https://zrh-ai-econ.com$request_uri;
}
server {
    listen 80;
    server_name zrh-ai-econ.com;
    root /opt/zrh-ai-econ/site;
    index index.html;
    absolute_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /chat { return 302 https://summer-chat.zrh-ai-econ.com/$is_args$args; }
    location ^~ /chat/ { rewrite ^/chat/(.*)$ https://summer-chat.zrh-ai-econ.com/$1 redirect; }
    location = /summer-school { return 301 /$is_args$args; }
    location = /summer-school/ { return 301 /$is_args$args; }
    location = /summer-school/2026 { return 301 /$is_args$args; }
    location = /summer-school/2026/ { return 301 /$is_args$args; }
    location = /summer-school/2026/chat { return 301 /chat$is_args$args; }
    location ^~ /summer-school/2026/chat/ { rewrite ^/summer-school/2026/chat/(.*)$ /chat/$1 permanent; }

    # Former lab routes retain deep links at the new lab domain.
    location ~ ^/(people|research|grants|kb)(/|$) { return 301 https://ai-econ-lab.org$request_uri; }
    location / { try_files $uri $uri/ =404; }
    location ~ (^|/)\. { return 404; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ~* \.(?:css|svg|pdf)$ { add_header Cache-Control "public, max-age=300"; try_files $uri =404; }
}
